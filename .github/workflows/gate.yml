name: gate

# The Dharma Harness runs its own falsifier on every push. A codex whose SHAUCHA
# axis is "ship no residue" cannot ship a rule nobody can test — so the rule that
# CAN be tested is tested here, and the README says plainly which ones cannot.
#
# No step interpolates untrusted input into a shell. The only expressions in this
# file are `github.workflow` / `github.ref` inside `concurrency:` and
# `github.event_name` inside an `if:`. None of the three reaches a `run:`, and
# none of them is attacker-controlled text (an issue title, a branch name, a
# commit message). Keep it that way: anything from `github.event.*` belongs in
# `env:` and is read as "$VAR", never pasted into a shell line.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, for the citation gate's --online pass only. Every other step here
    # is offline and deterministic; this one asks whether the source URLs in
    # sources/ still resolve, which is a question that can only go stale.
    - cron: "0 6 * * 1"

concurrency:
  # A new push on the same branch cancels the previous run: without this a burst
  # of commits pays for N runs and only the last one matters.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  side-effects:
    name: side-effect gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The gate diffs against the merge base. At the default depth of 1
          # there is no merge base to find and the gate exits 2 — correctly, and
          # uselessly.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip pytest

      - name: Self-check (the repo keeps its own promises)
        run: python3 scripts/check.py

      - name: Side-effect gate, on the diff
        if: github.event_name == 'pull_request'
        run: python3 gate/side_effects.py --base origin/main

      - name: Side-effect gate, whole tree
        # On a push to main the diff against origin/main is empty, and a gate
        # that judged nothing reports clean. Scanning every tracked Python file
        # keeps the green badge attached to something.
        run: python3 gate/side_effects.py --files $(git ls-files '*.py') --sarif side-effects.sarif

      - name: Citation gate (every attributed quotation traces to a source)
        # SATYA 4 — "invent nothing: no fabricated file, function, path,
        # citation, benchmark, or result." This is that rule made executable.
        run: python3 gate/citations.py --sarif citations.sarif

      - name: Citation gate, online (scheduled runs only)
        # Link rot in a source URL is not a reason to block a commit that never
        # touched the link, but it IS something to find out about before a
        # reader does. A provenance file whose URL 404s proves nothing.
        if: github.event_name == 'schedule'
        run: python3 gate/citations.py --online

      - name: Mutation check (do the tests defend the gate?)
        run: python3 tests/mutation_check.py

      - name: Mutation check (do the tests defend the citation gate?)
        run: python3 tests/mutation_check_citations.py

      - name: Tests
        run: python3 -m pytest tests/ -q

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: side-effects-sarif
          path: side-effects.sarif
          if-no-files-found: ignore
